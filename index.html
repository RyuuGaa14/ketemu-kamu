<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ketemu Kamu ❤️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    .card {
      background: rgba(255,255,255,0.9);
      padding: 30px 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      animation: fadeIn 2s ease;
    }
    h1 {
      color: #ff4d6d;
      margin-bottom: 10px;
      font-size: 2.2rem;
    }
    p {
      color: #333;
      font-size: 1.1rem;
      line-height: 1.6;
    }
    .heart {
      position: absolute;
      color: #ff4d6d;
      font-size: 20px;
      animation: float 6s linear infinite;
      opacity: 0.7;
    }
    @keyframes float {
      0% { transform: translateY(100vh) scale(1); }
      100% { transform: translateY(-10vh) scale(1.5); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Ketemu Kamu 💖</h1>
    <p>
      Dari sekian banyak hal indah di dunia ini,<br />
      ketemu kamu adalah salah satu yang paling aku syukuri.
    </p>
    <p>
      Terima kasih sudah hadir,<br />
      bikin aku senyum tanpa alasan,<br />
      dan bikin hari-hariku lebih hangat.
    </p>
    <p><strong>Aku sayang kamu 🤍</strong></p>
  </div>

  <script>
    const hearts = 20;
    for (let i = 0; i < hearts; i++) {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerHTML = '❤';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (4 + Math.random() * 4) + 's';
      heart.style.fontSize = (16 + Math.random() * 24) + 'px';
      document.body.appendChild(heart);
    }
  </script>
</body>
</html>
